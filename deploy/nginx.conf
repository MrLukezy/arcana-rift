# gacha.lukezystudio.cn —— Arcana Rift：撕卡抽卡图鉴（100 卡）
server {
    listen 80;
    server_name gacha.lukezystudio.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name gacha.lukezystudio.cn;
    ssl_certificate     /etc/letsencrypt/live/lukezystudio.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lukezystudio.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:GachaSub:10m;
    server_tokens off;
    charset utf-8;

    root /var/www/gacha-site;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;

    location ~* \.(webp|gif|png|jpg|jpeg|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # 代码/页面每次都回源校验，避免改了 JS/CSS 还看旧版
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
}
